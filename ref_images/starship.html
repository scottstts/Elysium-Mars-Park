const OLM = { DECK_Z: 20.60, TABLE_BOT: 17.90, LEG_N: 6, R_DECK: 10.30, R_HOLE: 4.86, PLAT_Z: 1.30 };

function olmBuild(){
  const T_MAIN = 0, T_DARK = 1, T_GRATE = 2, T_DKM = 3, T_CONC = 4, T_CONCD = 5,
        T_BLK = 6, T_SOOT = 7, T_ORG = 8, T_WHT = 9;
  const slots = ['tower', 'tower_dark', 'grate', 'dark_metal', 'concrete', 'concrete_dk',
                 'black', 'steel_dirty', 'orange', 'white'];
  const { DECK_Z, TABLE_BOT, LEG_N, R_DECK, R_HOLE, PLAT_Z } = OLM;
  const objs = [];
  let mb;

  /* -------- launch table -------- */
  mb = new MB();
  lathe(mb, [[R_DECK - 0.55, TABLE_BOT - 1.55], [R_DECK, TABLE_BOT - 0.85],
             [R_DECK, DECK_Z - 0.28], [R_DECK + 0.22, DECK_Z - 0.10],
             [R_DECK + 0.22, DECK_Z]], 72, { mat: T_DARK, smooth: true });
  lathe(mb, [[R_DECK + 0.22, DECK_Z], [R_HOLE + 0.35, DECK_Z]], 72, { mat: T_GRATE, smooth: false });
  lathe(mb, [[R_HOLE + 0.35, DECK_Z], [R_HOLE, DECK_Z - 0.45], [R_HOLE, TABLE_BOT - 2.6]], 72,
        { mat: T_SOOT, smooth: true });
  lathe(mb, [[R_HOLE, TABLE_BOT - 2.6], [R_DECK - 0.55, TABLE_BOT - 1.55]], 72,
        { mat: T_DKM, smooth: false });
  for (let k = 0; k < 20; k++){
    const a = TAU * k / 20;
    const x = (R_HOLE + 0.62) * cos(a), y = (R_HOLE + 0.62) * sin(a);
    prism(mb, [x, y, DECK_Z - 0.05], [x, y, DECK_Z + 1.05], sec_box(0.62, 0.50),
          { up: [cos(a), sin(a), 0], mat: T_DKM, smooth: false });
  }
  for (let k = 0; k < 12; k++){
    const a = TAU * k / 12 + 0.26;
    const r = R_DECK - 1.5;
    const x = r * cos(a), y = r * sin(a);
    const h = 1.1 + 0.65 * ((k * 7) % 5) / 5.0;
    prism(mb, [x, y, DECK_Z], [x, y, DECK_Z + h], sec_box(1.5, 1.1),
          { up: [cos(a), sin(a), 0], mat: (k % 3) ? T_DKM : T_MAIN, smooth: false });
  }
  const pts = [];
  for (let k = 0; k < 40; k++)
    pts.push([(R_DECK + 0.05) * cos(TAU * k / 40), (R_DECK + 0.05) * sin(TAU * k / 40)]);
  railing(mb, pts, DECK_Z + 0.05, 1.15, T_MAIN, 1.7);

  for (let k = 0; k < LEG_N; k++){
    const a = TAU * k / LEG_N + radians(30);
    const rt = 7.85, rb = 9.95;
    const top = [rt * cos(a), rt * sin(a), TABLE_BOT - 0.5];
    const bot = [rb * cos(a), rb * sin(a), PLAT_Z];
    prism(mb, bot, top, sec_tube(1.28, 26), { up: [0, 0, 1], mat: T_DARK, smooth: true, scale1: 1.10 });
    prism(mb, [bot[0], bot[1], PLAT_Z], [bot[0], bot[1], PLAT_Z + 0.68], sec_box(3.5, 3.5),
          { up: [cos(a), sin(a), 0], mat: T_DKM, smooth: false });
    const a2 = TAU * ((k + 1) % LEG_N) / LEG_N + radians(30);
    const span = TABLE_BOT - 0.5 - PLAT_Z;
    for (const [h0, h1] of [[0.28, 0.60]]){
      const p0 = [(rb + (rt - rb) * h0) * cos(a), (rb + (rt - rb) * h0) * sin(a), PLAT_Z + span * h0];
      const p1 = [(rb + (rt - rb) * h1) * cos(a2), (rb + (rt - rb) * h1) * sin(a2), PLAT_Z + span * h1];
      prism(mb, p0, p1, sec_tube(0.26, 10), { up: [0, 0, 1], mat: T_DARK, smooth: true });
      const p0b = [(rb + (rt - rb) * h1) * cos(a), (rb + (rt - rb) * h1) * sin(a), PLAT_Z + span * h1];
      const p1b = [(rb + (rt - rb) * h0) * cos(a2), (rb + (rt - rb) * h0) * sin(a2), PLAT_Z + span * h0];
      prism(mb, p0b, p1b, sec_tube(0.26, 10), { up: [0, 0, 1], mat: T_DARK, smooth: true });
    }
  }
  objs.push({ name: 'OLM_Table', mb, smooth: 32, slots });

  /* -------- booster quick disconnect -------- */
  mb = new MB();
  {
    const a = radians(200);
    const bx = 8.6 * cos(a), by = 8.6 * sin(a);
    prism(mb, [bx, by, PLAT_Z], [bx, by, DECK_Z - 1.2], sec_box(4.2, 3.4),
          { up: [cos(a), sin(a), 0], mat: T_DARK, smooth: false });
    prism(mb, [bx * 0.72, by * 0.72, DECK_Z - 2.4], [bx * 1.02, by * 1.02, DECK_Z - 1.6],
          sec_box(2.4, 2.0), { up: [0, 0, 1], mat: T_DKM, smooth: false });
  }
  objs.push({ name: 'OLM_BQD', mb, smooth: null, slots });

  /* -------- square launch platform -------- */
  mb = new MB();
  {
    const x0 = -38.0, x1 = 30.0, y0 = -31.0, y1 = 31.0, T = PLAT_Z;
    const i0 = mb.offset();
    for (const [x, y] of [[x1, y1], [x0, y1], [x0, y0], [x1, y0]]) mb.add_v([x, y, T]);
    mb.add_f([i0, i0+1, i0+2, i0+3], [[0,0],[9,0],[9,8],[0,8]], false, T_CONC);
    const j0 = mb.offset();
    for (const [x, y] of [[x1, y1], [x0, y1], [x0, y0], [x1, y0]]) mb.add_v([x, y, T - 2.4]);
    mb.add_f([j0+3, j0+2, j0+1, j0], [[0,0],[9,0],[9,8],[0,8]], false, T_CONCD);
    for (let k = 0; k < 4; k++){
      const k2 = (k + 1) % 4;
      mb.add_f([i0+k, i0+k2, j0+k2, j0+k], [[0,1],[6,1],[6,0],[0,0]], false, T_CONCD);
    }
    for (const [ax, ay, bx2, by2] of [[x1, y0, x1, y1], [x0, y1, x1, y1],
                                      [x0, y0, x0, y1], [x0, y0, x1, y0]])
      prism(mb, [ax, ay, T], [bx2, by2, T], sec_box(0.55, 1.05),
            { up: [0, 0, 1], mat: T_BLK, smooth: false, ext0: 0.28, ext1: 0.28 });
  }
  objs.push({ name: 'Pad_Platform', mb, smooth: null, slots });

  return objs;
}

function assemble(){
  const DECK = OLM.DECK_Z;
  const SHIP_Z = DECK + BST.BOOST_H - 0.06;
  const SHIP_YAW = -90.0;

  const [pad_x, pad_y, pad_ztop_rel] = pad_geom(TW.PAD_SEAT, 1);
  const VEH_X = pad_x;

  const flap_underside = y_abs => {
    const z0 = SHIP.FWD_FLAP.z_bot, chord = SHIP.FWD_FLAP.chord;
    const hinge = hull_r(z0) + 0.10;
    const u = Math.min(Math.max((y_abs - hinge) / chord, 0.0), 1.0);
    return z0 + u * chord * tan(radians(SHIP.FWD_FLAP.bot_sweep_deg));
  };
  const ARM_Z = SHIP_Z + flap_underside(Math.abs(pad_y)) - pad_ztop_rel;

  TW.ARM_Z = ARM_Z;
  TW.VEHICLE_X = VEH_X;

  const objs = [];
  for (const o of shipBuild()){    o.pos = [VEH_X, 0, SHIP_Z]; o.rotZ = radians(SHIP_YAW); objs.push(o); }
  for (const o of boosterBuild()){ o.pos = [VEH_X, 0, DECK];  objs.push(o); }
  for (const o of towerBuild())    objs.push(o);
  for (const o of olmBuild()){
    if (o.name === 'OLM_Table' || o.name === 'OLM_BQD') o.pos = [VEH_X, 0, 0];
    objs.push(o);
  }
  return { objs, VEH_X, ARM_Z, SHIP_Z, DECK };
}
/* ==========================================================================
   9.  renderer + standard studio lighting  (NOT ported from Blender)
   ========================================================================== */
function studioEnvTexture(){
  const W = 512, H = 256;
  const data = new Float32Array(W * H * 4);
  const boxes = [
    { d: new THREE.Vector3( 0.62, 0.52,  0.58).normalize(), r: 0.40, i: 4.20, c: [1.00, 0.98, 0.94] },
    { d: new THREE.Vector3(-0.78, 0.34,  0.40).normalize(), r: 0.60, i: 1.10, c: [0.84, 0.90, 1.00] },
    { d: new THREE.Vector3(-0.22, 0.42, -0.88).normalize(), r: 0.40, i: 2.30, c: [0.94, 0.97, 1.00] },
    { d: new THREE.Vector3( 0.00, 1.00,  0.00).normalize(), r: 0.85, i: 0.55, c: [1.00, 1.00, 1.00] }
  ];
  const ss = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
  for (let y = 0; y < H; y++){
    const theta = (y + 0.5) / H * Math.PI;
    const dy = Math.cos(theta), s = Math.sin(theta);
    for (let x = 0; x < W; x++){
      const phi = (x + 0.5) / W * TAU - Math.PI;
      const dx = s * Math.sin(phi), dz = -s * Math.cos(phi);
      const t = ss(-0.55, 0.85, dy);
      let r = 0.030 + 0.230 * t, g = 0.032 + 0.245 * t, b = 0.038 + 0.280 * t;
      const grad = ss(-0.02, -0.35, dy) * 0.55;         // soft floor bounce
      r += grad * 0.11; g += grad * 0.105; b += grad * 0.095;
      for (const L of boxes){
        const d = dx * L.d.x + dy * L.d.y + dz * L.d.z;
        const w = ss(Math.cos(L.r * 1.9), Math.cos(L.r), d) * L.i;
        if (w > 0){ r += w * L.c[0]; g += w * L.c[1]; b += w * L.c[2]; }
      }
      const o = (y * W + x) * 4;
      data[o] = r; data[o+1] = g; data[o+2] = b; data[o+3] = 1;
    }
  }
  const tex = new THREE.DataTexture(data, W, H, THREE.RGBAFormat, THREE.FloatType);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.LinearSRGBColorSpace;
  tex.minFilter = tex.magFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
}

function studioLights(scene){
  const mk = (hex, inten, pos, shadow) => {
    const l = new THREE.DirectionalLight(hex, inten);
    l.position.set(pos[0], pos[1], pos[2]);
    l.target.position.set(0, 68, 0);
    scene.add(l, l.target);
    if (shadow){
      l.castShadow = true;
      l.shadow.mapSize.set(4096, 4096);
      const c = l.shadow.camera;
      c.left = -110; c.right = 110; c.top = 150; c.bottom = -150;
      c.near = 1; c.far = 1400;
      c.updateProjectionMatrix();
      l.shadow.bias = -0.0006;
      l.shadow.normalBias = 0.45;
    }
    return l;
  };
  mk(0xfff4e6, 3.1, [ 320, 300,  300], true);   // key
  mk(0xd6e4ff, 0.9, [-360, 170,  190], false);  // fill
  mk(0xf2f6ff, 1.9, [-120, 230, -400], false);  // rim / back
  return scene;
}

const wait = () => new Promise(r => setTimeout(r, 0));

async function main(){
  if (!navigator.gpu) throw new Error(
    'WebGPU is not available in this browser.\n' +
    'This build uses three.js TSL with WGSL nodes and needs a WebGPU-capable browser.');

  const canvas = document.getElementById('c');
  const load = document.getElementById('load');
  const t0 = performance.now();

  load.textContent = 'building geometry…';
  await wait();

  const M = buildMaterials();
  const { objs, VEH_X, ARM_Z } = assemble();

  const scene = new THREE.Scene();
  const root = new THREE.Group();
  root.rotation.x = -Math.PI / 2;               // Blender Z-up -> three.js Y-up
  scene.add(root);

  let tris = 0;
  for (let i = 0; i < objs.length; i++){
    const o = objs[i];
    load.textContent = `building ${o.name}  (${i + 1}/${objs.length})`;
    await wait();
    const g = buildGeometry(o.mb, o.smooth);
    tris += g.userData.tris;
    const mesh = new THREE.Mesh(g, o.slots.map(k => M[k]));
    mesh.name = o.name;
    if (o.pos) mesh.position.set(o.pos[0], o.pos[1], o.pos[2]);
    if (o.rotZ) mesh.rotation.z = o.rotZ;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    root.add(mesh);
    o.mb = null;
  }

  load.textContent = 'compiling shaders…';
  await wait();

  const renderer = new THREE.WebGPURenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.AgXToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  await renderer.init();

  const envTex = studioEnvTexture();
  try {
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromEquirectangular(envTex).texture;
    envTex.dispose();
  } catch (e){
    console.warn('PMREM failed, using raw equirect env', e);
    scene.environment = envTex;
  }
  scene.environmentIntensity = 1.0;
  scene.backgroundNode = mix(vec3(0.055, 0.062, 0.072), vec3(0.012, 0.013, 0.016),
                             screenUV.sub(vec2(0.5, 0.42)).length().mul(1.45).clamp(0, 1));
  studioLights(scene);

  const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.5, 6000);
  camera.position.set(196, 104, 176);
  const controls = new OrbitControls(camera, canvas);
  controls.target.set(-4, 70, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 4;
  controls.maxDistance = 2000;
  controls.update();

  addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  await renderer.compileAsync(scene, camera);

  load.remove();
  const dt = ((performance.now() - t0) / 1000).toFixed(1);
  document.getElementById('hud').textContent =
    `Starship / Super Heavy / OLIT — three.js r${THREE.REVISION} WebGPU + TSL\n` +
    `${objs.length} objects   ${tris.toLocaleString()} tris   built in ${dt}s\n` +
    `VEH_X ${VEH_X.toFixed(2)}   ARM_Z ${ARM_Z.toFixed(2)}   drag to orbit / scroll to zoom`;

  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
  window.__scene = scene; window.__renderer = renderer; window.__camera = camera;
}

main().catch(fail);

</script>
